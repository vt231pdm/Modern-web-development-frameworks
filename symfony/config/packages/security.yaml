security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  role_hierarchy:
    ROLE_MANAGER: ROLE_CLIENT
    ROLE_ADMIN: ROLE_MANAGER

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    login:
      pattern: ^/api/login
      stateless: true
      json_login:
        check_path: /api/login_check
        username_path: email
        password_path: password
        success_handler: lexik_jwt_authentication.handler.authentication_success
        failure_handler: lexik_jwt_authentication.handler.authentication_failure

    api:
      pattern: ^/api
      stateless: true
      jwt: ~

  access_control:
    - { path: ^/api/(login|login_check|register), roles: PUBLIC_ACCESS }
    - {
        path: ^/api/(customers|tables|menu-items|reservations|orders),
        methods: [DELETE],
        roles: ROLE_ADMIN,
      }
    - { path: ^/api/customers, methods: [GET, POST, PUT], roles: ROLE_MANAGER }
    - { path: ^/api/(menu-items|tables), methods: [GET], roles: ROLE_CLIENT }
    - {
        path: ^/api/(menu-items|tables),
        methods: [POST, PUT],
        roles: ROLE_MANAGER,
      }
    - {
        path: ^/api/(reservations|orders),
        methods: [GET, POST],
        roles: ROLE_CLIENT,
      }
    - { path: ^/api/(reservations|orders), methods: [PUT], roles: ROLE_MANAGER }
    - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
